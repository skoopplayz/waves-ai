<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Tutormate AI</title>
      
      <meta name="theme-color" content="#b6b6b6">
      <meta name="msapplication-TileColor" content="#b6b6b6">
      
      <link rel="icon" type="image/x-icon" href="/assets/images/icons/favicon.ico">
      
      <link rel="stylesheet" href="/assets/css/index.css">
      <link rel="stylesheet" href="/assets/css/toast.css">


      <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.23.0/themes/prism-tomorrow.min.css">
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/vs2015.min.css">
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/nprogress/0.2.0/nprogress.min.css">
      <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
      <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
      <script src="https://cdnjs.cloudflare.com/ajax/libs/nprogress/0.2.0/nprogress.min.js"></script>
   </head>
   <body>
      <script src="/assets/js/index.js" defer></script>
      <script src="/assets/js/load.js" defer></script>
      
      <div class="chat-container">
         <div class="chat-header">
         <h1>Tutormate AI <span class="version"><i class="fas fa-flask"></i> beta</h1> 
         </div>
         
         <div class="branding">
            <img src="assets/images/icons/Untitled design-10-2.png" alt="TutorMate Logo">
         </div>

         <div class="chat-options">
    <div class="option">
        <div class="selector" id="modelSelector">
            <div class="selector-selected" data-value="llama-3.3-70b-versatile">TutorMate</div>
            <div class="selector-options" style="display: none;">
            </div>
        </div>
    </div>
</div>
         
         <div class="chat-body" id="chatBody"></div>
         <div class="suggestions-container" id="suggestionsContainer"></div>
         <div class="chat-input">
            <input type="text" aria-label="Text box for responses" id="aiInput" placeholder="What would you like to talk about?" autocomplete="off">
            <button aria-label="Enter Button" id="sendMsg"><i class="fas fa-arrow-up"></i></button>
         </div>
      </div>
   </body>
</html>
